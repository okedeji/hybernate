name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The chart's version and appVersion, and the kustomize image, are
  # committed with the release (make release does it), so installing from
  # the tagged source gets the image the tag publishes.
  versions:
    name: Versions match the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          grep -qx "version: ${TAG#v}" charts/hybernate/Chart.yaml
          grep -qx "appVersion: \"${TAG}\"" charts/hybernate/Chart.yaml
          grep -qx "  newTag: ${TAG}" config/manager/kustomization.yaml

  test:
    name: Test
    needs: [versions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make test
      - run: make vulncheck

  e2e:
    name: E2E
    needs: [versions]
    uses: ./.github/workflows/test-e2e.yml

  helm-smoke:
    name: Helm smoke
    needs: [versions]
    uses: ./.github/workflows/helm-smoke.yml

  # Scanned before anything is pushed: once the release job pushes, the
  # version's tag already points at the image.
  scan:
    name: Image vulnerabilities (${{ matrix.platform }})
    needs: [versions]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - run: docker buildx build --platform ${{ matrix.platform }} --load -t hybernate:scan .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hybernate:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  release:
    name: Build and Release
    needs: [test, e2e, helm-smoke, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the image and chart in GHCR
      id-token: write # keyless signing
      attestations: write # build provenance
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # A pre-release, such as v0.3.0-rc.1, has a hyphen. It isn't tagged
      # latest, so it's installed only by asking for it.
      - name: Pick the image's tags
        id: tags
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "list<<EOF"
            echo "${image}:${TAG}"
            if [[ "$TAG" != *-* ]]; then echo "${image}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest the image's build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      - name: Sign container image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Generate SBOM
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} -o spdx-json=sbom.spdx.json

      - name: Attach SBOM to image
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # Static, so the Linux binaries run on Alpine and Amazon Linux as well
      # as glibc distributions, and krew-index requires the LICENSE in each.
      - name: Build kubectl-hybernate plugin binaries
        run: |
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${platform%/*}
            arch=${platform#*/}
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            bin=kubectl-hybernate-${os}-${arch}${ext}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${TAG}" \
              -o "$bin" ./cmd/kubectl-hybernate
            tar czf "kubectl-hybernate-${os}-${arch}.tar.gz" "$bin" LICENSE
          done

      - name: Generate and validate the Krew manifest
        run: |
          mkdir -p krew
          ./hack/krew-manifest.sh "$TAG" "${{ github.repository }}" > krew/hybernate.yaml
          # The release's archives aren't uploaded yet, so installing from
          # the manifest's URIs is left to krew-index's own checks.
          GOBIN="$PWD/krew" go install sigs.k8s.io/krew/cmd/validate-krew-manifest@v0.5.0
          ./krew/validate-krew-manifest -manifest krew/hybernate.yaml -skip-install
          cp krew/hybernate.yaml krew-hybernate.yaml

      - name: Generate install manifest
        run: |
          make build-installer IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      # The chart's version is the tag without its v, as Chart.yaml has it.
      - name: Package, push, and sign Helm chart
        run: |
          helm package charts/hybernate --version "${TAG#v}" --app-version "${TAG}"
          helm push hybernate-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts 2>&1 | tee helm-push.log
          digest=$(awk '/^Digest:/ {print $2}' helm-push.log)
          test -n "$digest"
          cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/hybernate@${digest}

      - name: Sign the release files' checksums
        run: |
          sha256sum dist/install.yaml hybernate-*.tgz kubectl-hybernate-*.tar.gz krew-hybernate.yaml sbom.spdx.json \
            > checksums.txt
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      - name: Attest the release files' build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-checksums: checksums.txt

      - name: Report the image's vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          output: vulnerabilities.txt

      - name: Extract changelog for release
        run: |
          VERSION="${TAG#v}"
          awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found" CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
          prerelease: ${{ steps.tags.outputs.prerelease }}
          files: |
            dist/install.yaml
            hybernate-*.tgz
            kubectl-hybernate-*.tar.gz
            krew-hybernate.yaml
            sbom.spdx.json
            checksums.txt
            checksums.txt.sigstore.json
            vulnerabilities.txt
