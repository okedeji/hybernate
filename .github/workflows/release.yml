name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make test
      - run: make vulncheck

  # Scanned before anything is pushed: once the release job pushes, the
  # version's tag and latest already point at the image.
  scan:
    name: Image vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t hybernate:scan .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hybernate:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  release:
    name: Build and Release
    needs: [test, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the image and chart in GHCR
      id-token: write # keyless signing
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Extract version
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest the image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign container image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Generate SBOM
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }} -o spdx-json=sbom.spdx.json

      - name: Attach SBOM to image
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Build kubectl-hybernate plugin binaries
        run: |
          for os in linux darwin; do
            for arch in amd64 arm64; do
              GOOS=$os GOARCH=$arch go build -o kubectl-hybernate-${os}-${arch} ./cmd/kubectl-hybernate
              tar czf kubectl-hybernate-${os}-${arch}.tar.gz kubectl-hybernate-${os}-${arch}
            done
          done

      - name: Generate Krew manifest with checksums
        run: |
          TAG=${{ steps.version.outputs.tag }}
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          cat > krew-hybernate.yaml <<EOF
          apiVersion: krew.googlecontainertools.github.com/v1alpha2
          kind: Plugin
          metadata:
            name: hybernate
          spec:
            version: ${TAG}
            homepage: https://github.com/${{ github.repository }}
            shortDescription: Find idle workloads, and wake paused ones
            description: |
              Hybernate pauses idle Kubernetes workloads and wakes them when
              they're used. The plugin scans your clusters for idle Deployments
              and StatefulSets and what they cost, wakes paused workloads, and
              ends dry-run for workloads Hybernate is measuring.
            platforms:
          EOF

          for os in linux darwin; do
            for arch in amd64 arm64; do
              sha=$(sha256sum kubectl-hybernate-${os}-${arch}.tar.gz | cut -d' ' -f1)
              cat >> krew-hybernate.yaml <<PLATFORM
              - selector:
                  matchLabels:
                    os: ${os}
                    arch: ${arch}
                uri: ${BASE_URL}/kubectl-hybernate-${os}-${arch}.tar.gz
                sha256: "${sha}"
                bin: kubectl-hybernate-${os}-${arch}
          PLATFORM
            done
          done

      - name: Generate install manifest
        run: |
          make build-installer IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.tag }}

      - name: Package, push, and sign Helm chart
        run: |
          helm package charts/hybernate --version ${{ steps.version.outputs.tag }} --app-version ${{ steps.version.outputs.tag }}
          helm push hybernate-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts 2>&1 | tee helm-push.log
          digest=$(awk '/^Digest:/ {print $2}' helm-push.log)
          test -n "$digest"
          cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/hybernate@${digest}

      - name: Sign the release files' checksums
        run: |
          sha256sum dist/install.yaml hybernate-*.tgz kubectl-hybernate-*.tar.gz krew-hybernate.yaml sbom.spdx.json \
            > checksums.txt
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt

      - name: Attest the release files' build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: checksums.txt

      - name: Report the image's vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          output: vulnerabilities.txt

      - name: Extract changelog for release
        id: changelog
        run: |
          TAG=${{ steps.version.outputs.tag }}
          VERSION="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md
          awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found" CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          files: |
            dist/install.yaml
            hybernate-*.tgz
            kubectl-hybernate-*.tar.gz
            krew-hybernate.yaml
            sbom.spdx.json
            checksums.txt
            checksums.txt.sigstore.json
            vulnerabilities.txt
