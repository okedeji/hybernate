name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The chart's version and appVersion, the kustomize image, and the docs'
  # install and verify commands are committed with the release (make release
  # does it), so installing from the tagged source gets the image the tag
  # publishes.
  versions:
    name: Versions match the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          TAG: ${{ github.ref_name }}
        run: make verify-version VERSION="${TAG#v}"

  # make release commits the version bump and tags it without a pull
  # request, so the tag gets every check a pull request does.
  test:
    name: Test
    needs: [versions]
    uses: ./.github/workflows/test.yml

  lint:
    name: Lint
    needs: [versions]
    uses: ./.github/workflows/lint.yml

  # Scanned before anything is pushed: once the release job pushes, the
  # version's tag already points at the image.
  security:
    name: Security
    needs: [versions]
    uses: ./.github/workflows/security.yml

  e2e:
    name: E2E
    needs: [versions]
    uses: ./.github/workflows/test-e2e.yml

  helm-smoke:
    name: Helm smoke
    needs: [versions]
    uses: ./.github/workflows/helm-smoke.yml

  release:
    name: Build and Release
    needs: [test, lint, security, e2e, helm-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      packages: write # the image and chart in GHCR
      id-token: write # keyless signing
      attestations: write # build provenance
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A pre-release, such as v0.3.0-rc.1, has a hyphen. It isn't tagged
      # latest, so it's installed only by asking for it.
      - name: Pick the image's tags
        id: tags
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          {
            echo "list<<EOF"
            echo "${image}:${TAG}"
            if [[ "$TAG" != *-* ]]; then echo "${image}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Attest the image's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign container image
        run: |
          cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Install syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Generate SBOM
        run: |
          syft ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} -o spdx-json=sbom.spdx.json

      - name: Attach SBOM to image
        run: |
          cosign attest --yes --predicate sbom.spdx.json --type spdxjson ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      # Static, so the Linux binaries run on Alpine and Amazon Linux as well
      # as glibc distributions, and krew-index requires the LICENSE in each.
      - name: Build kubectl-hybernate plugin binaries
        run: |
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${platform%/*}
            arch=${platform#*/}
            ext=""
            if [ "$os" = windows ]; then ext=.exe; fi
            bin=kubectl-hybernate-${os}-${arch}${ext}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=${TAG}" \
              -o "$bin" ./cmd/kubectl-hybernate
            tar czf "kubectl-hybernate-${os}-${arch}.tar.gz" "$bin" LICENSE
          done

      - name: Generate and validate the Krew manifest
        run: |
          mkdir -p krew
          ./hack/krew-manifest.sh "$TAG" "${{ github.repository }}" > krew/hybernate.yaml
          # The release's archives aren't uploaded yet, so installing from
          # the manifest's URIs is left to krew-index's own checks.
          GOBIN="$PWD/krew" go install sigs.k8s.io/krew/cmd/validate-krew-manifest@v0.5.0
          ./krew/validate-krew-manifest -manifest krew/hybernate.yaml -skip-install
          cp krew/hybernate.yaml krew-hybernate.yaml

      - name: Generate install manifest
        run: |
          make build-installer IMG=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      # The chart's version is the tag without its v, as Chart.yaml has it.
      - name: Package, push, and sign Helm chart
        run: |
          helm package charts/hybernate --version "${TAG#v}" --app-version "${TAG}"
          helm push hybernate-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts 2>&1 | tee helm-push.log
          digest=$(awk '/^Digest:/ {print $2}' helm-push.log)
          test -n "$digest"
          cosign sign --yes ${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/hybernate@${digest}

      # The release uploads each file under its base name, so they're hashed
      # from one directory: checksums.txt then names them as users download
      # them, and sha256sum --check finds each one beside it.
      - name: Collect the release files
        run: |
          mkdir release
          cp dist/install.yaml hybernate-*.tgz kubectl-hybernate-*.tar.gz krew-hybernate.yaml sbom.spdx.json release/

      - name: Sign the release files' checksums
        working-directory: release
        run: |
          sha256sum -- * > ../checksums.txt
          cosign sign-blob --yes --bundle ../checksums.txt.sigstore.json ../checksums.txt

      - name: Attest the release files' build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: checksums.txt

      - name: Report the image's vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          output: vulnerabilities.txt

      - name: Extract changelog for release
        run: |
          VERSION="${TAG#v}"
          awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found" CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release-notes.md
          prerelease: ${{ steps.tags.outputs.prerelease }}
          files: |
            release/*
            checksums.txt
            checksums.txt.sigstore.json
            vulnerabilities.txt
