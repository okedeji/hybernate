name: E2E Tests

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test-e2e:
    name: E2E (Kubernetes ${{ matrix.kubernetes }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Kubernetes Hybernate supports, on the last kind
          # release with a node image for it.
          - kubernetes: "1.30"
            kind: v0.29.0
            kind-sha256: c72eda46430f065fb45c5f70e7c957cc9209402ef309294821978677c8fb3284
            node-image: kindest/node:v1.30.13@sha256:397209b3d947d154f6641f2d0ce8d473732bd91c87d9575ade99049aa33cd648
          - kubernetes: "1.37"
            kind: v0.33.0
            kind-sha256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
            node-image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-kind
        with:
          version: ${{ matrix.kind }}
          sha256: ${{ matrix.kind-sha256 }}
      - name: Running Test e2e
        run: make test-e2e KIND_NODE_IMAGE=${{ matrix.node-image }}

  # Branch protection requires a check named E2E, which a matrix job can't
  # report under that name. This one passes only if every version did, so
  # the requirement holds whichever versions the matrix lists.
  e2e:
    name: E2E
    needs: [test-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.test-e2e.result }}
        run: test "$RESULT" = success
