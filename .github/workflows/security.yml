name: Security

on:
  pull_request:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Fails only on vulnerabilities Hybernate's code reaches, not every
      # one in a module it imports.
      - run: make vulncheck

  image:
    name: Image vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t hybernate:scan .
      # Fails on critical and high vulnerabilities with a fix available;
      # unfixed ones are reported, not blocking, so an upstream bug with no
      # fix can't hold up every pull request.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hybernate:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
