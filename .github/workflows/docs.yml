name: docs

# Publishes each release's docs as a version of the site, built from the
# tag, so its install commands name that release: a release to its minor,
# such as 0.2, and to latest, where the site's root goes, when it's the
# newest; a release candidate to next, with a banner saying so (see
# hack/docsite). mike commits them to the gh-pages branch, which GitHub
# Pages serves. It runs once the Release workflow succeeds, so a tag whose
# release failed publishes nothing. Run it manually, naming a release's
# tag, to republish that release's docs. A pull request only builds them,
# so a broken link or page fails it rather than the next release's docs.
on:
  pull_request:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose docs to publish, such as v0.2.0 or v0.2.0-rc.1
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'gh-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A required check on main, by this job's name.
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install --require-hashes -r docs/requirements.txt

      - run: mkdocs build --strict

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # the gh-pages branch
    env:
      # The Release workflow runs on tags only, so its run's branch is the tag.
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: pip install --require-hashes -r docs/requirements.txt

      - run: mkdocs build --strict

      # mike commits on top of the published site, which doesn't exist
      # before the first publish.
      - name: Fetch the published site
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --depth=1 origin gh-pages:refs/remotes/origin/gh-pages
          fi

      - name: Publish the release's docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          go run ./hack/docsite -tag "$TAG" -push
