name: Helm Smoke Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  helm-smoke:
    name: Helm (watchNamespaces)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-kind
        with:
          version: v0.33.0
          sha256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Install the chart with watchNamespaces, and pause and wake a workload through the doorman
        run: make test-helm-smoke
