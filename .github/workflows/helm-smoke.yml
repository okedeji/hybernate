name: Helm Smoke Test

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  helm-smoke:
    name: Helm (watchNamespaces)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-kind
        with:
          version: v0.33.0
          sha256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - name: Install the chart with watchNamespaces, and pause and wake a workload through the doorman
        run: make test-helm-smoke
