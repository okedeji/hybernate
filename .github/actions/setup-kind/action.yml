name: Set up kind
description: Installs pinned kind and kubectl releases for linux/amd64, checking each against a pinned checksum.

inputs:
  version:
    description: The kind release, such as v0.33.0.
    required: true
  sha256:
    description: The SHA-256 of that release's kind-linux-amd64.
    required: true
  # kubectl supports one minor version of skew either side, so each caller
  # names the one matching its cluster's Kubernetes.
  kubectl-version:
    description: The kubectl release, such as v1.37.0.
    required: true
  kubectl-sha256:
    description: The SHA-256 of that release's linux/amd64 kubectl.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        VERSION: ${{ inputs.version }}
        SHA256: ${{ inputs.sha256 }}
        KUBECTL_VERSION: ${{ inputs.kubectl-version }}
        KUBECTL_SHA256: ${{ inputs.kubectl-sha256 }}
      run: |
        curl -fsSLo kind "https://github.com/kubernetes-sigs/kind/releases/download/${VERSION}/kind-linux-amd64"
        echo "${SHA256}  kind" | sha256sum --check --strict
        chmod +x kind
        sudo mv kind /usr/local/bin/kind
        kind version

        curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
        echo "${KUBECTL_SHA256}  kubectl" | sha256sum --check --strict
        chmod +x kubectl
        sudo mv kubectl /usr/local/bin/kubectl
        kubectl version --client
