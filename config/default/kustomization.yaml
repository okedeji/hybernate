# Installs Hybernate with a ClusterRole, watching every namespace. For
# Prometheus's ServiceMonitors and alerts, apply config/prometheus after
# this; to let only namespaces labelled metrics=enabled scrape, apply
# config/network-policy.
namespace: hybernate-system

namePrefix: hybernate-

resources:
- ../crd
- ../rbac
- ../manager
- metrics_service.yaml

patches:
# Serves metrics over HTTPS on :8443, to callers allowed to get /metrics.
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
    name: controller-manager
