# Installs Hybernate with a ClusterRole, watching every namespace. For
# Prometheus's ServiceMonitors and alerts, apply config/prometheus after
# this; to let only namespaces labelled metrics=enabled scrape, apply
# config/network-policy.
namespace: hybernate-system

namePrefix: hybernate-

resources:
- ../crd
- ../rbac
- ../manager
- metrics_service.yaml

patches:
# Serves metrics over HTTPS on :8443, to callers allowed to get /metrics.
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
    name: controller-manager

# The doorman's admission policy matches its ServiceAccount by username,
# which no transformer rewrites, so its namespace and name are written into
# the policy's matchCondition here, after the namespace and prefix.
replacements:
- source:
    kind: ServiceAccount
    name: doorman
    fieldPath: metadata.namespace
  targets:
  - select:
      kind: ValidatingAdmissionPolicy
      name: doorman
    fieldPaths:
    - spec.matchConditions.[name=doorman].expression
    options:
      delimiter: '"'
      index: 3
- source:
    kind: ServiceAccount
    name: doorman
    fieldPath: metadata.name
  targets:
  - select:
      kind: ValidatingAdmissionPolicy
      name: doorman
    fieldPaths:
    - spec.matchConditions.[name=doorman].expression
    options:
      delimiter: '"'
      index: 7
