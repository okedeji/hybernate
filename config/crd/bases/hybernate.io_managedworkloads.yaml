---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: managedworkloads.hybernate.io
spec:
  group: hybernate.io
  names:
    kind: ManagedWorkload
    listKind: ManagedWorkloadList
    plural: managedworkloads
    singular: managedworkload
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ManagedWorkload declares a workload whose lifecycle is managed
          by Hybernate.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ManagedWorkloadSpec defines the desired lifecycle behavior
              for a workload.
            properties:
              costTracking:
                description: |-
                  CostTracking configures custom cost rates for this workload.
                  Cost tracking is always enabled with AWS on-demand defaults.
                  Set this field only to override pricing rates.
                properties:
                  rates:
                    description: Rates overrides the default cost rates. Omit to use
                      AWS on-demand defaults.
                    properties:
                      cpuPerHour:
                        anyOf:
                        - type: integer
                        - type: string
                        description: 'CPUPerHour is the cost per vCPU-hour (default:
                          $0.031, AWS on-demand).'
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memoryPerHour:
                        anyOf:
                        - type: integer
                        - type: string
                        description: 'MemoryPerHour is the cost per GiB-hour (default:
                          $0.004, AWS on-demand).'
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storagePerMonth:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          StoragePerMonth is the cost per GiB-month for PVC storage
                          (default: $0.08, AWS EBS gp3).
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                type: object
              dependsOn:
                description: |-
                  DependsOn lists the workloads this one needs, such as a database or a
                  message broker. A dependency isn't paused while anything that depends
                  on it is awake, and waking this workload wakes its dependencies.
                items:
                  description: |-
                    DependencyRef names a workload this one needs. It refers to the
                    dependency's Deployment or StatefulSet, not to its ManagedWorkload.
                  properties:
                    kind:
                      enum:
                      - Deployment
                      - StatefulSet
                      type: string
                    name:
                      minLength: 1
                      type: string
                    namespace:
                      description: Namespace of the dependency. Defaults to the ManagedWorkload's
                        own.
                      type: string
                    waitForReady:
                      description: |-
                        WaitForReady holds this workload's resume, without scaling it, until
                        the dependency's pods are Ready. Use it when this workload fails if it
                        starts before the dependency can serve, e.g. a database replaying its
                        write-ahead log. By default dependencies wake at the same time.
                      type: boolean
                  required:
                  - kind
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              desiredState:
                description: |-
                  DesiredState overrides automation and forces the workload into the given
                  state. When set, the operator stops evaluating the idle policy and
                  drives the workload to this state instead.
                enum:
                - Running
                - Paused
                - Destroyed
                type: string
              destroy:
                description: |-
                  Destroy configures behavior after the workload is destroyed, including
                  PVC retention and cleanup.
                properties:
                  pvcRetention:
                    description: |-
                      PVCRetention is how long to keep PVCs after the workload is destroyed.
                      After this period, PVCs are deleted. Omit to delete PVCs immediately.
                    format: duration
                    type: string
                  pvcRetentionWarning:
                    description: |-
                      PVCRetentionWarning triggers a warning event this duration before
                      PVCs are deleted, giving users time to recover data if needed.
                    format: duration
                    type: string
                type: object
              dryRun:
                description: |-
                  DryRun makes the operator evaluate all policies and emit events but
                  take no action. Useful for validating configuration before going live.
                type: boolean
              idlePolicy:
                description: |-
                  IdlePolicy configures automatic idle detection. Signals detect ground
                  truth, the prediction engine confirms the pattern, and after a grace
                  period the operator executes the configured action (pause or destroy).
                properties:
                  action:
                    default: pause
                    description: |-
                      Action to take once the workload has been idle for IdleAfter. "pause"
                      scales to zero; "destroy" deletes the workload.
                    enum:
                    - pause
                    - destroy
                    type: string
                  activity:
                    description: |-
                      Activity configures what counts as activity, beyond the deploys and
                      activity annotations that always count.
                    properties:
                      cpuThreshold:
                        default: 10
                        description: |-
                          CPUThreshold is the CPU utilization, as a percentage of the workload's
                          CPU requests, above which the workload counts as active.
                        maximum: 100
                        minimum: 0
                        type: integer
                      prometheus:
                        description: |-
                          Prometheus queries that measure activity, such as an ingress request
                          rate. A result above zero counts as activity; an empty result or zero
                          doesn't. Requires the operator's --prometheus-url.
                        items:
                          description: PrometheusActivity is a PromQL instant query
                            used as an activity source.
                          properties:
                            promQL:
                              description: |-
                                PromQL is the query. Example:
                                sum(rate(nginx_ingress_controller_requests{exported_service="api"}[5m]))
                              minLength: 1
                              type: string
                          required:
                          - promQL
                          type: object
                        type: array
                    type: object
                  autoResume:
                    description: |-
                      AutoResume wakes a paused workload ahead of the demand the forecast
                      predicts.
                    type: boolean
                  idleAfter:
                    default: 1h
                    description: |-
                      IdleAfter is how long the workload must go without any activity
                      before the operator acts.
                    format: duration
                    type: string
                type: object
              pause:
                description: |-
                  Pause configures behavior while the workload is paused, including
                  automatic expiry and what action to take when the pause expires.
                properties:
                  expireAction:
                    default: destroy
                    description: |-
                      ExpireAction determines what happens when ExpireAfter elapses.
                      "destroy" deletes the workload; "resume" scales it back up.
                    enum:
                    - destroy
                    - resume
                    type: string
                  expireAfter:
                    description: |-
                      ExpireAfter is the maximum duration a workload can remain paused.
                      After this period, the operator executes the ExpireAction.
                    format: duration
                    type: string
                type: object
              prediction:
                description: |-
                  Prediction configures the Holt-Winters forecasting engine that confirms
                  idle detection and wakes paused workloads ahead of predicted demand.
                properties:
                  confidence:
                    default: 85
                    description: |-
                      Confidence is the minimum accuracy percentage (0-100) required before
                      the prediction engine transitions from suggesting (shadow mode) to
                      actively driving decisions.
                    maximum: 100
                    minimum: 0
                    type: integer
                required:
                - confidence
                type: object
              target:
                description: Target identifies the workload to manage (e.g. a Deployment
                  or StatefulSet).
                properties:
                  kind:
                    default: Deployment
                    enum:
                    - Deployment
                    - StatefulSet
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              wake:
                description: |-
                  Wake configures waking the workload when a request reaches it while
                  it's paused.
                properties:
                  maxWait:
                    default: 2m
                    description: |-
                      MaxWait is how long the doorman holds a connection while the workload
                      wakes. After it, the connection is closed; the wake carries on.
                    format: duration
                    type: string
                  onRequest:
                    default: true
                    description: |-
                      OnRequest routes the workload's Services to the doorman while it's
                      paused. When false, requests to a paused workload fail.
                    type: boolean
                  page:
                    default: true
                    description: |-
                      Page answers a browser loading a page with a "waking up" page that
                      refreshes until the workload is Running, instead of holding the
                      request. Other requests are held either way.
                    type: boolean
                type: object
            required:
            - prediction
            - target
            type: object
          status:
            description: ManagedWorkloadStatus reflects the observed state of the
              workload.
            properties:
              activity:
                description: Activity tracks when the workload was last active, for
                  idle detection.
                properties:
                  lastActivitySource:
                    description: LastActivitySource is what produced LastActivityTime.
                    enum:
                    - created
                    - woke
                    - request
                    - cpu
                    - rollout
                    - annotation
                    - prometheus
                    - unobserved
                    - scaled-up
                    type: string
                  lastActivityTime:
                    description: LastActivityTime is the most recent activity from
                      any source.
                    format: date-time
                    type: string
                  lastEvaluatedTime:
                    description: LastEvaluatedTime is when the operator last checked
                      for activity.
                    format: date-time
                    type: string
                  pauseAt:
                    description: |-
                      PauseAt is when the idle action will run if no further activity is
                      seen: LastActivityTime plus IdleAfter.
                    format: date-time
                    type: string
                  templateHash:
                    description: |-
                      TemplateHash fingerprints the target's pod template, so a deploy or
                      configuration change counts as activity while replica changes don't.
                    type: string
                required:
                - lastActivitySource
                - lastActivityTime
                type: object
              conditions:
                description: |-
                  Conditions provide detailed status information following the standard
                  Kubernetes condition pattern (Type, Status, Reason, Message).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              cost:
                description: Cost holds accumulated resource cost data for the current
                  month.
                properties:
                  currentMonthCPUHours:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CurrentMonthCPUHours is total vCPU-hours consumed
                      this month.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  currentMonthMemoryHours:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CurrentMonthMemoryHours is total GiB-hours of memory
                      consumed this month.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  currentMonthStorageHours:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CurrentMonthStorageHours is total GiB-hours of PVC
                      storage provisioned this month.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  estimatedCostWithoutManagement:
                    description: |-
                      EstimatedCostWithoutManagement is what this workload would have cost
                      without Hybernate — the sum of estimated cost and estimated savings.
                    type: string
                  estimatedMonthlyCost:
                    description: |-
                      EstimatedMonthlyCost is the projected cost for the full month based
                      on current usage patterns. Set to "pending" on day 1 of the month.
                    type: string
                  estimatedMonthlySavings:
                    description: |-
                      EstimatedMonthlySavings is the projected dollar amount saved by Hybernate
                      actions (pause, destroy) this month. These savings are only
                      realized when freed resources lead to node removal by a cluster autoscaler.
                    type: string
                  lastAccumulatedAt:
                    description: LastAccumulatedAt is when costs were last accumulated.
                    format: date-time
                    type: string
                  listRates:
                    description: |-
                      ListRates are the on-demand list rates of the nodes the workload's
                      pods last ran on, from their instance type and region, which its cost
                      and savings are priced at unless costTracking.rates sets its own.
                      Kept while it's paused, so savings are priced at where it ran. Unset
                      when its nodes aren't in Hybernate's price table, and the default
                      rates apply.
                    properties:
                      cpuPerHour:
                        anyOf:
                        - type: integer
                        - type: string
                        description: 'CPUPerHour is the cost per vCPU-hour (default:
                          $0.031, AWS on-demand).'
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memoryPerHour:
                        anyOf:
                        - type: integer
                        - type: string
                        description: 'MemoryPerHour is the cost per GiB-hour (default:
                          $0.004, AWS on-demand).'
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storagePerMonth:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          StoragePerMonth is the cost per GiB-month for PVC storage
                          (default: $0.08, AWS EBS gp3).
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  resourceReduction:
                    description: |-
                      ResourceReduction tracks the concrete resources freed by Hybernate actions.
                      Unlike cost estimates, these values are always accurate regardless of
                      whether a cluster autoscaler removes the underlying nodes.
                    properties:
                      cpuMillis:
                        description: CPUMillis is the total CPU millicores freed by
                          removing pods.
                        format: int64
                        type: integer
                      memoryBytes:
                        description: MemoryBytes is the total memory bytes freed by
                          removing pods.
                        format: int64
                        type: integer
                      replicas:
                        description: Replicas is the number of pod replicas removed.
                        format: int32
                        type: integer
                    required:
                    - cpuMillis
                    - memoryBytes
                    - replicas
                    type: object
                required:
                - currentMonthCPUHours
                - currentMonthMemoryHours
                - currentMonthStorageHours
                - estimatedCostWithoutManagement
                - estimatedMonthlyCost
                - estimatedMonthlySavings
                type: object
              destroy:
                description: Destroy holds state after the workload is destroyed.
                properties:
                  destroyedAt:
                    description: DestroyedAt is when the workload was destroyed.
                    format: date-time
                    type: string
                  pvcRetentionExpiresAt:
                    description: |-
                      PVCRetentionExpiresAt is when remaining PVCs will be cleaned up.
                      Only set when DestroySpec.PVCRetention is configured.
                    format: date-time
                    type: string
                  resources:
                    description: |-
                      Resources captures the workload's resource profile at destroy time
                      for cost savings calculation.
                    properties:
                      cpuMillis:
                        description: CPUMillis is total CPU request in millicores
                          per replica.
                        format: int64
                        type: integer
                      memoryBytes:
                        description: MemoryBytes is total memory request in bytes
                          per replica.
                        format: int64
                        type: integer
                      replicas:
                        description: Replicas is the replica count at the time of
                          the snapshot.
                        format: int32
                        type: integer
                      storageBytes:
                        description: StorageBytes is total PVC provisioned capacity
                          in bytes.
                        format: int64
                        type: integer
                    required:
                    - cpuMillis
                    - memoryBytes
                    - replicas
                    - storageBytes
                    type: object
                type: object
              doorman:
                description: |-
                  Doorman lists the doorman ports routing this workload's Services while
                  it's paused. Empty while it's awake.
                items:
                  description: |-
                    DoormanRoute maps one Service port to the doorman port that stands in for
                    it while the workload is paused.
                  properties:
                    doormanPort:
                      description: DoormanPort is the doorman's listening port for
                        this Service port.
                      format: int32
                      type: integer
                    portName:
                      description: PortName is the Service port's name; empty for
                        an unnamed single port.
                      type: string
                    service:
                      description: Service is the name of the Service in the workload's
                        namespace.
                      type: string
                  required:
                  - doormanPort
                  - service
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              dryRun:
                description: |-
                  DryRun is what dry-run has measured: what Hybernate would have done
                  had it been allowed to pause the workload. Set only while spec.dryRun
                  is true.
                properties:
                  estimatedSavings:
                    description: |-
                      EstimatedSavings is what the replicas freed during Slept would have
                      cost, at the workload's cost rates.
                    type: string
                  pauses:
                    description: |-
                      Pauses is how many times the workload would have been paused,
                      including one under way.
                    format: int32
                    type: integer
                  resources:
                    description: |-
                      Resources is what the workload ran when the current would-be pause
                      began, which is what pausing it would free.
                    properties:
                      cpuMillis:
                        description: CPUMillis is total CPU request in millicores
                          per replica.
                        format: int64
                        type: integer
                      memoryBytes:
                        description: MemoryBytes is total memory request in bytes
                          per replica.
                        format: int64
                        type: integer
                      replicas:
                        description: Replicas is the replica count at the time of
                          the snapshot.
                        format: int32
                        type: integer
                      storageBytes:
                        description: StorageBytes is total PVC provisioned capacity
                          in bytes.
                        format: int64
                        type: integer
                    required:
                    - cpuMillis
                    - memoryBytes
                    - replicas
                    - storageBytes
                    type: object
                  since:
                    description: Since is when dry-run started measuring the workload.
                    format: date-time
                    type: string
                  slept:
                    description: |-
                      Slept is how long the finished would-be pauses lasted in all. One
                      under way, which began at status.lastTransitionTime while the phase
                      is Idle, is added when it ends.
                    type: string
                required:
                - estimatedSavings
                - pauses
                - since
                - slept
                type: object
              lastActedAt:
                description: |-
                  LastActedAt is when the operator last mutated the target workload
                  (pause, resume, destroy, or drift correction).
                format: date-time
                type: string
              lastScaledUp:
                description: |-
                  LastScaledUp is the last time something other than Hybernate scaled
                  the workload up while it was paused, which wakes it.
                properties:
                  at:
                    format: date-time
                    type: string
                  by:
                    description: |-
                      By is the field manager that set the replicas, such as kubectl-scale
                      or argocd-controller.
                    type: string
                  gitOps:
                    description: |-
                      GitOps is the GitOps tool behind By, such as Argo CD or Flux, which
                      will set the replicas again each time Hybernate pauses the workload
                      until it's told to leave them.
                    type: string
                  replicas:
                    format: int32
                    type: integer
                required:
                - at
                - by
                - replicas
                type: object
              lastTransitionTime:
                description: LastTransitionTime is when the workload last changed
                  phases.
                format: date-time
                type: string
              pause:
                description: Pause holds state while the workload is paused.
                properties:
                  pausedAt:
                    description: PausedAt is when the workload was paused.
                    format: date-time
                    type: string
                  previousReplicas:
                    description: |-
                      PreviousReplicas is the replica count before pausing, used to
                      restore on resume.
                    format: int32
                    type: integer
                  resources:
                    description: |-
                      Resources captures the workload's resource profile at pause time
                      for cost savings calculation.
                    properties:
                      cpuMillis:
                        description: CPUMillis is total CPU request in millicores
                          per replica.
                        format: int64
                        type: integer
                      memoryBytes:
                        description: MemoryBytes is total memory request in bytes
                          per replica.
                        format: int64
                        type: integer
                      replicas:
                        description: Replicas is the replica count at the time of
                          the snapshot.
                        format: int32
                        type: integer
                      storageBytes:
                        description: StorageBytes is total PVC provisioned capacity
                          in bytes.
                        format: int64
                        type: integer
                    required:
                    - cpuMillis
                    - memoryBytes
                    - replicas
                    - storageBytes
                    type: object
                required:
                - previousReplicas
                type: object
              phase:
                description: Phase is the current lifecycle phase of the workload.
                enum:
                - Creating
                - Running
                - Idle
                - Pausing
                - Paused
                - Resuming
                - Destroying
                - Destroyed
                type: string
              prediction:
                description: Prediction reflects the current state of the forecasting
                  engine.
                properties:
                  dailyConfidence:
                    description: DailyConfidence is the daily season's prediction
                      accuracy percentage.
                    type: integer
                  dailyPhase:
                    description: |-
                      DailyPhase is the daily season's lifecycle phase
                      (Observing, Suggesting, or Active).
                    type: string
                  weeklyConfidence:
                    description: WeeklyConfidence is the weekly season's prediction
                      accuracy percentage.
                    type: integer
                  weeklyPhase:
                    description: |-
                      WeeklyPhase is the weekly season's lifecycle phase
                      (Observing, Suggesting, or Active).
                    type: string
                required:
                - dailyConfidence
                - dailyPhase
                - weeklyConfidence
                - weeklyPhase
                type: object
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
