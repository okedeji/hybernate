apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: hybernate
spec:
  version: v0.1.7
  homepage: https://github.com/okedeji/hybernate
  shortDescription: Find idle workloads, and wake paused ones
  description: |
    Hybernate pauses idle Kubernetes workloads and wakes them when
    they're used. The plugin scans your clusters for idle Deployments
    and StatefulSets and what they cost, wakes paused workloads, and
    ends dry-run for workloads Hybernate is measuring.

    Usage:
      kubectl hybernate scan
      kubectl hybernate wake my-app -n my-namespace
      kubectl hybernate enable my-app -n my-namespace
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/okedeji/hybernate/releases/download/v0.1.7/kubectl-hybernate-linux-amd64.tar.gz
      sha256: "PLACEHOLDER"
      bin: kubectl-hybernate-linux-amd64
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/okedeji/hybernate/releases/download/v0.1.7/kubectl-hybernate-linux-arm64.tar.gz
      sha256: "PLACEHOLDER"
      bin: kubectl-hybernate-linux-arm64
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/okedeji/hybernate/releases/download/v0.1.7/kubectl-hybernate-darwin-amd64.tar.gz
      sha256: "PLACEHOLDER"
      bin: kubectl-hybernate-darwin-amd64
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/okedeji/hybernate/releases/download/v0.1.7/kubectl-hybernate-darwin-arm64.tar.gz
      sha256: "PLACEHOLDER"
      bin: kubectl-hybernate-darwin-arm64
