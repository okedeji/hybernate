# promtool tests for the Helm chart's PrometheusRule, rendered for a
# release named hybernate, whose jobs are the chart's Services. Run with
# make test-alerts.
rule_files:
  - chart.rules.yaml

evaluation_interval: 1m

tests:
  - name: the operator is down while the doorman is up
    interval: 1m
    input_series:
      - series: up{job="hybernate-metrics"}
        values: 0x15
      - series: up{job="hybernate-doorman"}
        values: 1x15
    alert_rule_test:
      - eval_time: 10m
        alertname: HybernateDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Hybernate operator is down
              description: No healthy Hybernate operator target has been scraped for 5 minutes, so nothing is paused or woken.
      - eval_time: 10m
        alertname: HybernateDoormanDown
        exp_alerts: []

  - name: the doorman is down while the operator is up
    interval: 1m
    input_series:
      - series: up{job="hybernate-metrics"}
        values: 1x15
      - series: up{job="hybernate-doorman"}
        values: 0x15
    alert_rule_test:
      - eval_time: 10m
        alertname: HybernateDoormanDown
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Hybernate doorman is down
              description: No healthy doorman target has been scraped for 5 minutes, so requests to paused workloads fail instead of waking them.
      - eval_time: 10m
        alertname: HybernateDown
        exp_alerts: []

  - name: browsers shown the waking page are not failed wakes
    interval: 1m
    input_series:
      - series: hybernate_doorman_wakes_total{namespace="shop", workload="web", result="page"}
        values: 0+1x40
    alert_rule_test:
      - eval_time: 30m
        alertname: HybernateDoormanWakesFailing
        exp_alerts: []

  - name: held connections that time out are failed wakes
    interval: 1m
    input_series:
      - series: hybernate_doorman_wakes_total{namespace="shop", workload="web", result="timeout"}
        values: 0+1x40
    alert_rule_test:
      - eval_time: 30m
        alertname: HybernateDoormanWakesFailing
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: shop
              workload: web
            exp_annotations:
              summary: Doorman wakes failing for web
              description: Requests to paused workload shop/web are timing out or failing while it wakes. Check its events and the doorman logs.
