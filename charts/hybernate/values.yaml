image:
  repository: ghcr.io/okedeji/hybernate
  tag: "" # defaults to the chart's appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Installs the ManagedWorkload CRD and upgrades it with the release. It's
# kept on uninstall, since deleting it deletes every ManagedWorkload. Set
# false only if you manage the CRD yourself.
crds:
  install: true

# More than one replica needs leader election, so only one acts at a time.
replicaCount: 1

leaderElection:
  enabled: true

# How many ManagedWorkloads the operator reconciles at once, so one slow
# metrics or Prometheus query doesn't hold up waking another workload.
maxConcurrentReconciles: 4

# IANA time zone, such as Europe/London, whose hours and weekdays forecasts
# learn. Use your users' zone, so forecasts follow daylight saving.
timezone: UTC

# The operator caches the cluster's Deployments, StatefulSets, Services,
# PVCs, HPAs, nodes and namespaces (or only the watched namespaces'), so its
# memory grows with the cluster. Raise the limit on clusters with many
# thousands of workloads. The garbage collector aims at 90% of the limit,
# leaving the rest for memory outside its heap, and works harder near it
# rather than letting the operator be OOM-killed.
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 10m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

serviceAccount:
  create: true
  name: "" # defaults to the release's full name

metrics:
  enabled: true
  port: 8443
  # Serves metrics over HTTPS, to scrapers allowed to get /metrics, such as
  # those bound to the metrics-reader ClusterRole below. False serves plain
  # HTTP to anyone who can reach the port.
  secure: true
  # The ClusterRole the chart creates, while metrics.secure, is allowed to
  # get /metrics. List your Prometheus's ServiceAccount here to bind it:
  #   - kind: ServiceAccount
  #     name: prometheus-k8s
  #     namespace: monitoring
  readerSubjects: []
  serviceMonitor:
    enabled: false
    interval: 30s
    additionalLabels: {}
  prometheusRule:
    enabled: false
    additionalLabels: {}

prometheus:
  url: "" # required only for Prometheus activity queries, e.g. http://prometheus.monitoring.svc:9090

# Namespaces Hybernate works in. Empty means every namespace, with a
# ClusterRole; set, Hybernate gets a Role in each of these only, and can't
# read or scale workloads anywhere else.
watchNamespaces: []

# Name patterns, such as prod-*, of namespaces Hybernate never manages,
# as if labelled hybernate.io/protected=true, unless a namespace is
# labelled hybernate.io/allow-protected=true.
protectedNamespaces: []

# Settings for workloads opted in with the hybernate.io/managed label, where
# their own annotations and their namespace's don't say otherwise.
defaults:
  idleAfter: 1h
  cpuThreshold: 10
  dryRun: false

# The doorman wakes paused workloads when a request reaches them.
doorman:
  enabled: true
  replicaCount: 2
  # Keeps one doorman serving through node drains, when replicaCount > 1.
  podDisruptionBudget:
    enabled: true
  # Default to the operator's settings above when empty.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Empty spreads the replicas across nodes, where it can.
  topologySpreadConstraints: []
  # The doorman caches ManagedWorkloads, and the Services' EndpointSlices
  # in the watched namespaces, cut down to about 300 bytes per pod and
  # 700 per Service. Held connections take up to 72Mi more under a flood.
  # 256Mi covers a cluster of some 100,000 pods; raise the limit beyond.
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi

networkPolicy:
  enabled: false

logLevel: info
# json, or console for reading by eye.
logEncoder: json
