{{- if and .Values.metrics.enabled .Values.metrics.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "hybernate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hybernate.labels" . | nindent 4 }}
    {{- with .Values.metrics.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: hybernate.critical
      rules:
        - alert: HybernateReconcileErrorsHigh
          expr: rate(hybernate_reconcile_errors_total[5m]) > 0.1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Hybernate reconcile error rate is high"
            description: "Controller {{ "{{" }} $labels.controller {{ "}}" }} is seeing >0.1 errors/sec for 10 minutes."
        - alert: HybernateDown
          expr: absent(up{job=~".*hybernate.*"} == 1)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Hybernate operator is down"
            description: "No healthy Hybernate operator target has been scraped for 5 minutes."
    - name: hybernate.warning
      rules:
        - alert: HybernateWorkloadStuck
          expr: max by (namespace, workload, phase) (hybernate_workload_phase{phase=~"Pausing|Resuming|Destroying"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Workload {{ "{{" }} $labels.workload {{ "}}" }} stuck in {{ "{{" }} $labels.phase {{ "}}" }}"
            description: "ManagedWorkload {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.workload {{ "}}" }} has been {{ "{{" }} $labels.phase {{ "}}" }} for 15 minutes. Check its events and conditions."
        - alert: HybernateTargetUnavailable
          expr: increase(hybernate_target_unavailable_total[1h]) > 3
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Target workload not found for {{ "{{" }} $labels.workload {{ "}}" }}"
            description: "ManagedWorkload {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.workload {{ "}}" }} cannot find its target. It may have been deleted or renamed."
        - alert: HybernatePVCRetentionExpiring
          expr: hybernate_pvc_retention_remaining_seconds > 0 < 86400
          labels:
            severity: warning
          annotations:
            summary: "PVC retention expiring for {{ "{{" }} $labels.workload {{ "}}" }}"
            description: "PVCs for {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.workload {{ "}}" }} will be deleted in {{ "{{" }} $value | humanizeDuration {{ "}}" }}."
{{- end }}
