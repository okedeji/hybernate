{{- if .Values.doorman.enabled }}
{{- /*
The doorman holds connections to paused workloads and wakes them. It runs
the operator image with --doorman, separately so operator restarts don't
drop held connections. Every replica serves traffic.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hybernate.doormanName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.doorman.replicaCount }}
  {{- /*
  A rollout starts a new pod, and waits once it's Ready, before stopping an
  old one, so the doorman never runs short of pods and the operator has
  moved paused workloads' EndpointSlices to the new one first.
  */}}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "hybernate.doormanSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.doorman.podAnnotations | default .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- merge (include "hybernate.doormanSelectorLabels" . | fromYaml) (.Values.doorman.podLabels | default .Values.podLabels) | toYaml | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hybernate.doormanName" . }}
      {{- with .Values.doorman.priorityClassName | default .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- /*
      The 5s preStop sleep, then up to 25s for held and proxied
      connections to finish, with room to exit before SIGKILL.
      */}}
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: doorman
          image: {{ include "hybernate.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/manager]
          args:
            - --doorman
            - --health-probe-bind-address=:8081
            {{- with .Values.doorman.healthCheckUserAgents }}
            - {{ printf "--doorman-health-check-user-agents=%s" (join "," .) | quote }}
            {{- end }}
            {{- with .Values.watchNamespaces }}
            - {{ printf "--watch-namespaces=%s" (join "," .) | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - {{ printf "--metrics-bind-address=:%v" .Values.metrics.port | quote }}
            - {{ printf "--metrics-secure=%v" .Values.metrics.secure | quote }}
            {{- end }}
            - {{ printf "--zap-log-level=%v" .Values.logLevel | quote }}
            - {{ printf "--zap-encoder=%v" .Values.logEncoder | quote }}
          env:
            - name: MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            {{- with .Values.doorman.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            - name: probes
              containerPort: 8081
              protocol: TCP
          {{- /*
          Kube-proxies and load balancers keep sending new connections for
          a few seconds after the pod is marked terminating, until they see
          its endpoint go. The sleep keeps it listening through that, and
          needs no shell, which the image doesn't have.
          */}}
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.doorman.resources | nindent 12 }}
      {{- with .Values.doorman.nodeSelector | default .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.doorman.affinity | default .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.doorman.tolerations | default .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- with .Values.doorman.topologySpreadConstraints }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "hybernate.doormanSelectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "hybernate.doormanSelectorLabels" . | nindent 14 }}
        {{- end }}
{{- if and .Values.doorman.podDisruptionBudget.enabled (gt (int .Values.doorman.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hybernate.doormanName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "hybernate.doormanSelectorLabels" . | nindent 6 }}
{{- end }}
---
{{- /*
The operator finds the Ready doorman pods through this Service's
EndpointSlices and points paused workloads' Services at them. On a
dual-stack cluster it needs both families, or it can't route the other
family's Services.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hybernate.doormanName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
spec:
  ipFamilyPolicy: PreferDualStack
  selector:
    {{- include "hybernate.doormanSelectorLabels" . | nindent 4 }}
  ports:
    - name: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
      port: {{ .Values.metrics.port }}
      protocol: TCP
      targetPort: {{ .Values.metrics.port }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hybernate.doormanName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
---
{{- /*
The doorman reads its routes from ManagedWorkload status, reads the woken
workload's endpoints and the pods they name, and wakes it by patching an
annotation. Nothing else.
*/}}
{{- if not .Values.watchNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hybernate.doormanName" . }}
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
rules:
  {{- include "hybernate.doormanRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hybernate.doormanName" . }}
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hybernate.doormanName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hybernate.doormanName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hybernate.doormanName" $ }}
  namespace: {{ . }}
  labels:
    {{- include "hybernate.doormanLabels" $ | nindent 4 }}
rules:
  {{- include "hybernate.doormanRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hybernate.doormanName" $ }}
  namespace: {{ . }}
  labels:
    {{- include "hybernate.doormanLabels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hybernate.doormanName" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hybernate.doormanName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if and .Values.metrics.enabled .Values.metrics.secure }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hybernate.doormanName" . }}-auth-delegator
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "hybernate.doormanName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- with .Values.doorman.networkPolicy.egress }}
{{- if .enabled }}
{{- if or (not .podCIDRs) (not .apiServer) }}
{{- fail "doorman.networkPolicy.egress needs podCIDRs and apiServer, or the doorman can't reach pods or the API server" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hybernate.doormanName" $ }}-egress
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "hybernate.doormanLabels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hybernate.doormanSelectorLabels" $ | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        {{- range .podCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
    - to:
        {{- range .apiServer }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        {{- range .apiServerPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
{{- end }}
{{- end }}
