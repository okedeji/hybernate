{{- if .Values.doorman.enabled }}
{{- /*
The doorman holds connections to paused workloads and wakes them. It runs
the operator image with --doorman, separately so operator restarts don't
drop held connections. Every replica serves traffic.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hybernate.doormanName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.doorman.replicaCount }}
  selector:
    matchLabels:
      {{- include "hybernate.doormanSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hybernate.doormanSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "hybernate.doormanName" . }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: doorman
          image: {{ include "hybernate.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/manager]
          args:
            - --doorman
            - --health-probe-bind-address=:8081
            {{- with .Values.watchNamespaces }}
            - --watch-namespaces={{ join "," . }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:{{ .Values.metrics.port }}
            - --metrics-secure={{ .Values.metrics.secure }}
            {{- end }}
            - --zap-log-level={{ .Values.logLevel }}
            - --zap-encoder={{ .Values.logEncoder }}
          env:
            - name: MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
            - name: probes
              containerPort: 8081
              protocol: TCP
          {{- /*
          Kube-proxies and load balancers keep sending new connections for
          a few seconds after the pod is marked terminating, until they see
          its endpoint go. The sleep keeps it listening through that. The
          sleep action needs no shell, which the image doesn't have, and is
          on by default from Kubernetes 1.30.
          */}}
          {{- if semverCompare ">=1.30-0" .Capabilities.KubeVersion.Version }}
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.doorman.resources | nindent 12 }}
      {{- with .Values.doorman.nodeSelector | default .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.doorman.affinity | default .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.doorman.tolerations | default .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- with .Values.doorman.topologySpreadConstraints }}
        {{- toYaml . | nindent 8 }}
        {{- else }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "hybernate.doormanSelectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "hybernate.doormanSelectorLabels" . | nindent 14 }}
        {{- end }}
{{- if and .Values.doorman.podDisruptionBudget.enabled (gt (int .Values.doorman.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "hybernate.doormanName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "hybernate.doormanSelectorLabels" . | nindent 6 }}
{{- end }}
---
{{- /*
The operator finds the Ready doorman pods through this Service's
EndpointSlices and points paused workloads' Services at them. On a
dual-stack cluster it needs both families, or it can't route the other
family's Services.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hybernate.doormanName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
spec:
  ipFamilyPolicy: PreferDualStack
  selector:
    {{- include "hybernate.doormanSelectorLabels" . | nindent 4 }}
  ports:
    - name: {{ if .Values.metrics.secure }}https{{ else }}http{{ end }}
      port: {{ .Values.metrics.port }}
      protocol: TCP
      targetPort: {{ .Values.metrics.port }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hybernate.doormanName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
---
{{- /*
The doorman reads its routes from ManagedWorkload status, reads the woken
workload's endpoints, and wakes it by patching an annotation. Nothing else.
*/}}
{{- if not .Values.watchNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hybernate.doormanName" . }}
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
rules:
  {{- include "hybernate.doormanRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hybernate.doormanName" . }}
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "hybernate.doormanName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hybernate.doormanName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- range .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hybernate.doormanName" $ }}
  namespace: {{ . }}
  labels:
    {{- include "hybernate.doormanLabels" $ | nindent 4 }}
rules:
  {{- include "hybernate.doormanRules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hybernate.doormanName" $ }}
  namespace: {{ . }}
  labels:
    {{- include "hybernate.doormanLabels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hybernate.doormanName" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hybernate.doormanName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- if .Values.metrics.secure }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hybernate.doormanName" . }}-auth-delegator
  labels:
    {{- include "hybernate.doormanLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ include "hybernate.doormanName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
